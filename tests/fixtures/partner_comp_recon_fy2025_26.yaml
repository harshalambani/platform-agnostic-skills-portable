# Invented, self-consistent fixture for the Partner Compensation
# Reconciliation skill (agents.skill_partner_comp_recon). No figure here is
# copied or derived from any real document -- every number was chosen to
# exercise this package's arithmetic rules (see AGENT.md / engine.py):
#
#   - the misc-adjustment derivation (s.3.1)
#   - a one-off gross-up that lands exactly on a round lakh (s.3.2, CONFIRMED)
#   - the incentive-cohort FY straddle, with one instalment paid the
#     following financial year (s.4)
#   - the capital rule (s.5.1) landing exactly on the Advisory's stated
#     closing capital
#   - a mid-year capital-rate-change inside that same cohort (s.5.2) --
#     deliberately present *alongside* the s.5.1 agreement above, to
#     demonstrate that an aggregate match does not mask an
#     instalment-level anomaly
#   - every other external figure set to agree exactly with the computed
#     total, so the only two non-AGREE rows in Reconciliation/Exceptions
#     are the always-cannot-reconcile incentive-schedule leg (no PDF
#     parser in this build) and the rate-change suspect on Capital.

