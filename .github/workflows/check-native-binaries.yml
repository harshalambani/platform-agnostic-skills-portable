# .github/workflows/check-native-binaries.yml
#
# Scheduled check for new releases of vendored native binaries
# (Tesseract, Poppler, qpdf). Tesseract is checked against
# tesseract-ocr/tesseract. Opens an issue when a newer version
# is detected compared to what's pinned in bundling/binaries.toml.
#
# Runs weekly on Tuesdays. Can also be triggered manually.

name: Check Native Binary Updates

on:
  schedule:
    - cron: "0 8 * * 2"   # 08:00 UTC every Tuesday
  workflow_dispatch:        # manual trigger

permissions:
  contents: read      # required for actions/checkout to read a private repo
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            bundling/binaries.toml
            scripts/native_binary_updates.py

      - name: Check for updates
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Latest upstream tags. A failed lookup gives an empty string, which
          # the comparison script skips (it never reports an empty tag).
          latest_tess=$(gh api repos/tesseract-ocr/tesseract/releases/latest --jq '.tag_name' 2>/dev/null || echo "")
          latest_poppler=$(gh api repos/oschwartz10612/poppler-windows/releases/latest --jq '.tag_name' 2>/dev/null || echo "")
          latest_qpdf=$(gh api repos/qpdf/qpdf/releases/latest --jq '.tag_name' 2>/dev/null || echo "")

          echo "Latest: tesseract=$latest_tess  poppler=$latest_poppler  qpdf=$latest_qpdf"

          # The script parses binaries.toml and reports only a release that is
          # NEWER than the pin (no report for the current pin).
          updates=$(python3 scripts/native_binary_updates.py \
            --toml bundling/binaries.toml \
            --tesseract "$latest_tess" --poppler "$latest_poppler" --qpdf "$latest_qpdf")

          if [ -z "$updates" ]; then
            echo "All native binaries are up to date."
            exit 0
          fi

          echo "UPDATES<<EOF" >> $GITHUB_ENV
          printf '%s\n' "$updates" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Open issue if updates found
        if: env.UPDATES != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pass the findings as a shell variable, NOT via ${{ }} interpolation.
          # The value contains markdown backticks; injecting it into the script
          # text would make bash run e.g. `5.5.4` as a command. Referenced as
          # "$UPDATES" below, the backticks stay literal.
          UPDATES: ${{ env.UPDATES }}
        run: |
          set -euo pipefail

          # Ensure the labels exist (idempotent). Without this, a repo that has
          # never had these labels makes `gh issue create --label` fail with
          # "could not add label: ... not found" and the whole job goes red.
          gh label create native-binary-update --color 0e8a16 \
            --description "Vendored native binary has a newer upstream release" 2>/dev/null || true
          gh label create dependencies --color 0366d6 \
            --description "Dependency updates" 2>/dev/null || true

          # Skip if a tracking issue is already open.
          existing=$(gh issue list --label native-binary-update --state open \
            --limit 1 --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ -n "$existing" ]; then
            echo "Issue #$existing already open — skipping."
            exit 0
          fi

          # Build the body from "$UPDATES" (a shell variable). Variable values
          # are never rescanned for command substitution, so its backticks are
          # emitted literally. printf keeps the escaped backticks below literal.
          {
            printf '%s\n\n' "The following vendored native binaries have newer releases:"
            printf '%s\n\n' "$UPDATES"
            printf '%s\n'   "**To update:**"
            printf '%s\n'   "1. Edit \`bundling/binaries.toml\`: new version, URL and sha256 (hash the file at the URL; do not run it)"
            printf '%s\n'   "2. Poppler and qpdf: run \`python bundling/refresh_binaries.py --target <name>\` to verify the pin and refill \`vendor/\`"
            printf '%s\n'   "3. Tesseract is an installer: install it by hand, then run \`python bundling/refresh_binaries.py --from-tesseract <install dir>\`"
            printf '%s\n\n' "4. Commit the updated \`vendor/\` directory"
            printf '%s\n'   "_This issue was opened automatically by the check-native-binaries workflow._"
          } > issue-body.md

          gh issue create \
            --title "Native binary updates available" \
            --label native-binary-update,dependencies \
            --body-file issue-body.md
