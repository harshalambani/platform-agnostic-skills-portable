name: CI

on:
  push:
    branches: ["main", "dev", "release/**"]
  pull_request:
    branches: ["main"]

# The default GITHUB_TOKEN scope is broader than any job here needs: every
# step only reads the checkout. Declaring it once at the top applies to all
# jobs, so a compromised or careless action cannot write to the repo.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Verify the dependency lock file is present, UTF-8, and fully hashed.
  #
  # This is a fast (<10s) pre-flight that catches the most common supply-chain
  # hygiene mistakes before the slow build runs:
  #   - Lock file was deleted or not committed
  #   - Lock file was regenerated without --generate-hashes
  #   - Lock file is still in the legacy UTF-16 encoding
  #   - requirements.txt was updated but lock was not regenerated
  # ---------------------------------------------------------------------------
  lock-check:
    name: Dependency lock integrity
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Lock file exists
        run: |
          if [ ! -f requirements-lock.txt ]; then
            echo "::error file=requirements-lock.txt::requirements-lock.txt is missing."
            echo "  Run: python scripts/regen_lock.py  and commit the output."
            exit 1
          fi
          echo "requirements-lock.txt found."

      - name: Lock file is UTF-8 (not UTF-16)
        run: |
          # UTF-16 LE BOM is ff fe; UTF-16 BE BOM is fe ff.
          head_hex=$(head -c 2 requirements-lock.txt | xxd -p)
          if [ "$head_hex" = "fffe" ] || [ "$head_hex" = "feff" ]; then
            echo "::error file=requirements-lock.txt::requirements-lock.txt is UTF-16 encoded."
            echo "  Run: python scripts/regen_lock.py  to regenerate as UTF-8."
            exit 1
          fi
          echo "requirements-lock.txt encoding OK (not UTF-16)."

      - name: Lock file contains hashes
        run: |
          if ! grep -q -- "--hash=sha256:" requirements-lock.txt; then
            echo "::error file=requirements-lock.txt::requirements-lock.txt contains no hashes."
            echo "  Run: python scripts/regen_lock.py  to add SHA-256 hashes."
            exit 1
          fi
          n=$(grep -c -- "--hash=sha256:" requirements-lock.txt || true)
          echo "Lock file OK — ${n} hash entries found."

      # The three checks above prove the lock file is well-FORMED. None of them
      # proves it is INSTALLABLE, and those are different things: a dependency
      # bump can pin a version that contradicts another package's metadata, and
      # the resulting lock is still present, UTF-8 and fully hashed. Dependabot
      # #145 was exactly this -- websockets 17.0.1 against langgraph-sdk's
      # "websockets<16,>=14". Nothing here would have caught it if merged; it
      # would have surfaced at frozen-build time instead.
      #
      # --dry-run resolves and verifies hashes without installing, so this stays
      # fast. It gates: an unresolvable lock is never a warning.
      - name: Lock file is installable
        run: |
          set +e
          pip install \
            --require-hashes \
            --dry-run \
            --ignore-installed \
            -r requirements-lock.txt > "$RUNNER_TEMP/lock-install.txt" 2>&1
          rc=$?
          set -e
          tail -40 "$RUNNER_TEMP/lock-install.txt"
          if [ "$rc" -ne 0 ]; then
            echo "::error file=requirements-lock.txt::requirements-lock.txt cannot be installed (pip exit ${rc})."
            echo "  Usually a pinned version contradicting another package's"
            echo "  metadata -- read the resolver output above for the conflicting pair."
            exit 1
          fi
          echo "Lock file resolves and all hashes verify."

      # This step is ADVISORY by design: exact pip-compile output varies by
      # pip-tools version, so a difference is reported as a warning, never a
      # failure. That has to include pip-compile failing to run at all --
      # pip-tools reads pip's private internals, so a pip release can break it
      # overnight with no change on our side (pip 26.2 removed
      # pip._internal.utils.compat.stdlib_pkgs, which took this job down on
      # 2026-08-06 and, via `needs: lock-check`, skipped the whole test job).
      #
      # The three checks above are the ones that genuinely gate; this one must
      # not be able to. It stays loud in the log either way.
      - name: Lock file is in sync with requirements.txt
        continue-on-error: true
        run: |
          if ! pip install pip-tools --quiet; then
            echo "::warning::Could not install pip-tools; skipping the lock-sync comparison."
            exit 0
          fi

          if ! pip-compile \
            --generate-hashes \
            --resolver backtracking \
            --no-header \
            --annotate \
            --output-file /tmp/lock-fresh.txt \
            requirements.txt
          then
            echo "::warning::pip-compile failed to run, so the lock file could not be"
            echo "  compared against requirements.txt. This is a pip/pip-tools"
            echo "  compatibility problem, not a lock-file problem -- the lock file's"
            echo "  presence, encoding and hashes were all verified above."
            exit 0
          fi

          if ! diff -q /tmp/lock-fresh.txt requirements-lock.txt > /dev/null 2>&1; then
            echo "::warning file=requirements-lock.txt::requirements-lock.txt may be out of date."
            diff /tmp/lock-fresh.txt requirements-lock.txt | head -40 || true
            echo "  If requirements.txt changed, run: python scripts/regen_lock.py"
          else
            echo "Lock file is up to date with requirements.txt."
          fi

  # ---------------------------------------------------------------------------
  # Job 2: Lint + tests (runs on every push/PR, independent of lock-check).
  # ---------------------------------------------------------------------------
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    needs: lock-check

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: |
          # Installs from the LOCK, not from requirements.txt, so the versions
          # under test are the versions that ship.
          #
          # This used to install the loose pins. That made a green suite a
          # statement about a version set nobody runs: bundling/build.py installs
          # requirements-lock.txt, and the two files resolve differently -- the
          # loose pins float to whatever is newest and compatible, the lock is
          # pinned to whatever was last compiled. So the artifact's actual
          # dependency set was never exercised by anything.
          #
          # It was worse than merely untested, because build.py passes --no-deps:
          # pip installs the pinned list verbatim without evaluating anyone's
          # metadata. requirements-lock.txt therefore shipped tomlkit==0.15.1
          # against gradio's "tomlkit<0.15.0", and click==8.4.0 against
          # huggingface-hub's "click>=8.4.2", for weeks. Every build installed
          # exactly that and never complained.
          #
          # The native-window pair still has to come out -- pythonnet needs a
          # .NET toolchain and pywebview needs GTK/Qt, neither of which exists
          # on a bare ubuntu runner, and the lock carries no environment markers
          # to skip them by. The app imports both lazily and degrades to browser
          # mode without them, so the tests do not need them.
          #
          # scripts/ci_lock_subset.py rather than `grep -v`: a hashed lock is a
          # multi-line format, and grep would strip the "name==ver \" line while
          # leaving its --hash continuations behind for pip to misread as part of
          # the PREVIOUS package. The script also refuses to drop a package that
          # a kept one requires (pywebview requires pythonnet), and errors if an
          # excluded name is absent, so an upstream rename cannot quietly turn
          # the filter into a no-op.
          python -m pip install --upgrade pip
          python scripts/ci_lock_subset.py \
            --exclude pywebview pythonnet \
            --out "$RUNNER_TEMP/ci-lock.txt"
          pip install --require-hashes -r "$RUNNER_TEMP/ci-lock.txt"
          # Test-only, deliberately not in requirements.txt: the bank-parser
          # tests synthesise their own fixtures rather than committing real
          # statements -- reportlab writes the PDFs, xlwt the legacy .xls.
          # Separate call: --require-hashes above applies per-command, and these
          # are not in the lock.
          pip install pytest reportlab xlwt

      # Nothing here is advisory any more. A failing TEST fails the job, and so
      # does a suite that could not RUN -- but they are still reported as
      # different things, because the old `continue-on-error: true` flattened
      # them into one. On 2026-08-06 a module-level sys.exit() in a collected
      # file raised SystemExit during collection; pytest reported INTERNALERROR
      # and collected nothing -- and this step reported success. CI had been
      # showing a green check over a suite of zero tests.
      #
      # Exit 1 was tolerated with a ::warning:: until 2026-08-07, on the stated
      # condition "once the suite is green on CI". That condition is now met.
      # #161 made this job install requirements-lock.txt instead of the loose
      # pins, which is what supplies langchain-core and friends, and the suite
      # exited 0 for the first time. The old rationale -- "some tests need
      # langchain_core, which we deliberately don't install" -- no longer holds,
      # so the tolerance that rested on it is gone.
      #
      # pytest exit codes: 0 = all passed, 1 = tests failed, 2 = interrupted
      # (what INTERNALERROR produces), 3 = internal error, 4 = usage error,
      # 5 = no tests collected.
      #
      # `-x` is gone deliberately: stopping at the first failure hides how much
      # of the suite is broken, which is the thing this step exists to report.
      - name: Run tests (non-build-time-only)
        run: |
          cd src
          set +e
          python -m pytest ../tests/ \
            --ignore=../tests/test_phase4_build.py \
            --ignore=../tests/test_phase4b_webui.py \
            -q > "$RUNNER_TEMP/pytest-out.txt" 2>&1
          rc=$?
          set -e
          tail -120 "$RUNNER_TEMP/pytest-out.txt"
          case "$rc" in
            0) echo "All tests passed." ;;
            1) echo "::error::Tests failed (exit 1) -- see the tally above."; exit 1 ;;
            5) echo "::error::pytest collected NO tests. The suite did not run."; exit 1 ;;
            *) echo "::error::pytest could not complete the run (exit ${rc}) -- collection error, internal error, or bad invocation. This is NOT a test failure: the suite did not run."; exit 1 ;;
          esac

      # No tolerance here at all. These two files import cleanly with the deps
      # installed above, so any non-zero exit is a real security regression.
      - name: Security static checks
        run: |
          cd src
          python -m pytest \
            ../tests/test_csv_analyzer_security.py \
            ../tests/test_dispatcher_security.py \
            -q
