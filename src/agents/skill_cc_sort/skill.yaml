# skill.yaml — Credit Card Sort skill manifest

name: "CC Sort"
display_name: "Credit Card — Sort PDFs"
description: >
  Extract PDFs from Outlook emails (.msg) and organize credit card statement
  PDFs by bank and card type. Supports encrypted PDFs with multiple passwords.
  Auto-detects bank from filename (Axis, HDFC, YES, SBM, ICICI, HSBC, SBI).
category: "credit_card"
version: "1.0.0"

mode: "direct"
entry_point: "agent:run"

inputs:
  - name: "input_folder"
    type: "directory"
    label: "Input folder (MSG files and/or PDFs)"
    required: true
  - name: "password"
    type: "password"
    label: "PDF password(s), comma-separated (or leave blank for auto-detect)"
    required: false
  - name: "period"
    type: "select"
    options_from: "report_periods"
    label: "Completeness check period (Indian FY = 1 Apr to 31 Mar)"
    required: true
  - name: "custom_start"
    type: "text"
    label: "Custom start date (YYYY-MM-DD) -- only for 'Custom date range'"
    required: false
  - name: "custom_end"
    type: "text"
    label: "Custom end date (YYYY-MM-DD) -- only for 'Custom date range'"
    required: false

run_args:
  input_folder: "{inputs.input_folder}"
  output_folder: "{output_path_dir}"
  password: "{inputs.password}"
  period: "{inputs.period}"
  custom_start: "{inputs.custom_start}"
  custom_end: "{inputs.custom_end}"
  config_path: "{config_path}"
  settings_path: "{data_root}/settings/config.yaml"
  model_override: "{model_override}"

output:
  type: "directory"
  suffix: "CC-Sort"
  download_label: "Open output folder"

requires:
  native_binaries: ["qpdf"]
  external_tools: []
  llm: false

help:
  overview: >
    Takes a messy folder of credit-card statements and organises it: it pulls
    PDF attachments out of Outlook .msg emails, decrypts password-protected PDFs
    (via qpdf), and sorts everything by bank/issuer into a clean folder tree.
    Statement CSV exports are placed by card as well. It then checks the sorted
    folder for gaps in the chosen period. Works offline and does not use the LLM.
  when_to_use: >
    Use this as the first step when you have a pile of statement emails and PDFs
    from several cards. Once sorted, run "Credit Card — Transactions" on the decrypted
    folder to extract the actual transactions.
  inputs:
    - name: "input_folder"
      tooltip: "A folder containing your .msg emails and/or statement PDFs (subfolders are fine). Use Browse, or type or paste the path."
      accepts: "A folder of .msg and/or .pdf files."
      gotchas: "Point at the folder itself, not an individual file."
    - name: "period"
      tooltip: "Which period the completeness check covers. Indian financial year runs 1 Apr to 31 Mar; Q1 is Apr-Jun, Q4 is Jan-Mar."
      accepts: "A FY, a quarter of a FY, or a custom date range. The first choice is the last completed FY."
      gotchas: "For a single month, choose 'Custom date range' and enter the first and last day below."
    - name: "custom_start"
      tooltip: "Start date, only used when 'Custom date range' is selected."
      accepts: "YYYY-MM-DD."
      gotchas: "Both start and end are required for a custom range, and start must not be after end."
    - name: "custom_end"
      tooltip: "End date, only used when 'Custom date range' is selected."
      accepts: "YYYY-MM-DD."
      gotchas: "Both start and end are required for a custom range."
    - name: "password"
      tooltip: "Password(s) for protected PDFs. Leave blank to auto-try common patterns."
      accepts: "Text — one password, or several comma-separated. Optional."
      gotchas: "If decryption fails, supply the exact password here; auto-detect only covers common formats."
  steps:
    - "Select the folder holding your statement emails / PDFs."
    - "Optionally enter PDF password(s); leave blank to auto-detect."
    - "Optionally enter the financial year to check (default: the last completed one)."
    - "Click Run, then open the output folder."
  outputs:
    folder: "Data/outputs/"
    files:
      - name: "YYYY-MM-DD-HHMMSS-CC-Sort/  (a folder)"
        tooltip: >
          Contains Decrypted_PDFs_Correct/ — the unlocked, de-duplicated PDFs to
          feed into Credit Card — Transactions — alongside copies sorted by issuer. Use the
          "Open output folder" button to browse it.
  tips: >
    This step never reads transaction amounts; it only unlocks and organises.
    The folder it produces is the exact input the Credit Card — Transactions skill expects.
  troubleshooting:
    - problem: "A PDF stays locked / is skipped."
      fix: "Enter its password in the password box (comma-separate multiple) and re-run."
    - problem: "The result says \"Sort completed with\" followed by a number of issues."
      fix: "Each issue is one line: a missing month for a card, a PDF that stayed locked, or a file that could not be placed on a card. Read the lines, fix the cause (password, missing statement, card list) and re-run. The same text is saved as completeness_report.txt in the output folder."
    - problem: "A file landed in the Unknown-Unknown folder."
      fix: "It could not be placed on one card: the file name and the card number printed inside disagree, or the digits are not on your card list. The result names the file and the reason. Fix the card list or rename the file and re-run."
    - problem: "A .msg is skipped with \"Could not read ... as an Outlook .msg\"."
      fix: "That file is not a readable .msg. The rest of the folder is still processed. Re-save the email and run again."
    - problem: "Source-mode run fails on decryption."
      fix: "qpdf must be on PATH in source mode; the frozen build bundles it."
