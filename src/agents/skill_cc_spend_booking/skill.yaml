# skill.yaml - Credit Card - Book Spends (cash basis)

name: "CC Book Spends"
display_name: "Credit Card - Book Spends"
description: >
  Match each bank payment to a credit card to the statement it settles, and write an
  import-ready GnuCash journal that books that statement's spends, refunds, cashback and
  fees against Expense:Withdrawals:Credit Card Payment. Payments, tie-outs and EMI rows are never
  guessed: unmatched payments, part payments and EMI rows are reported, not booked. A statement
  that does not tie out is imported anyway and reported first as NOT TIED, with each of its
  journals marked in the workbook, so it is checked before the import. The account for a spend is chosen by rules and history first, then by an AI
  step for what is left, and every AI match passes the account guards.
category: "gnucash"
version: "0.1.0"

mode: "direct"
entry_point: "agent:run"

inputs:
  - name: "entity"
    type: "select"
    label: "Entity -- fills in the GnuCash book below and names the Bank Service Charge and Drawings accounts"
    options_from: "itr_entities"
    required: true
  - name: "fy"
    type: "select"
    label: "Financial year -- picks the entity's book for that year"
    options_from: "itr_ay_years"
    required: true
  - name: "gnucash_path"
    type: "file"
    label: "GnuCash book (read-only; its card payments are matched to the statements)"
    file_types: [".gnucash"]
    required: true
    book_from: "entity"
    fy_from: "fy"
  - name: "pdf_dir"
    type: "directory"
    folders_from: "cc_sort_runs"
    label: "Organized PDFs folder (Decrypted_PDFs_Correct/ from Credit Card - Sort PDFs)"
    required: true
  - name: "period"
    type: "select"
    options_from: "report_periods"
    label: "Period of bank payments to book (Indian FY = 1 Apr to 31 Mar)"
    required: true
  - name: "custom_start"
    type: "text"
    label: "Custom start date (YYYY-MM-DD) -- only for 'Custom date range'"
    required: false
  - name: "custom_end"
    type: "text"
    label: "Custom end date (YYYY-MM-DD) -- only for 'Custom date range'"
    required: false
  - name: "prepayment_marks"
    type: "text"
    label: "Corporate card prepayments -- codes of unmatched payments to book to the prepayment account (optional)"
    required: false
  - name: "cred_emails"
    type: "directory"
    label: "Payment confirmation emails (optional)"
    required: false

run_args:
  pdf_dir: "{inputs.pdf_dir}"
  entity_key: "{inputs.entity}"
  gnucash_path: "{inputs.gnucash_path}"
  output_path: "{output_path}"
  period: "{inputs.period}"
  custom_start: "{inputs.custom_start}"
  custom_end: "{inputs.custom_end}"
  prepayment_marks: "{inputs.prepayment_marks}"
  cred_email_dir: "{inputs.cred_emails}"
  entities_path: "{data_root}/itr/entities.yaml"
  settings_path: "{data_root}/settings/config.yaml"
  config_path: "{config_path}"
  model_override: "{model_override}"

output:
  extension: ".csv"
  suffix: "CC-Spend_GnuCash_import_ready"
  download_label: "Download import-ready CSV"
  extra_outputs:
    - key: "workbook"
      label: "Run workbook"
      download_label: "Download run workbook (Excel)"

requires:
  native_binaries: []
  external_tools: []
  llm: true

help:
  overview: >
    Cash basis. A payment line on a card statement settles the PREVIOUS statement of the same card.
    Each bank payment in the book (a debit on Expense:Withdrawals:Credit Card Payment) is matched to
    that line one-to-one: exact, or a CRED payment that is up to 50 rupees more than the bank amount (the entity's cc_cred_max_overage in entities.yaml, 0 to 500),
    within 5 days, or a part payment made of 2 to 4 bank payments. Ambiguous, unmatched and partly
    matched cases are reported, never guessed. The settled statement's spends, refunds, cashback and
    fees become two-split journals against Credit Card Payment. A statement whose tie-out is not PASS is
    still booked (on its settling payment's date, or its real dates when no payment settles it) and is
    reported first as NOT TIED, with every one of its journals marked in the workbook; only a statement
    that read 0 rows is refused. HSBC EMI: each instalment principal is booked as a spend (the converted purchase is withheld), the interest to the entity card_emi_interest_account, the processing fee and GST to Bank Service Charge; the credit legs and the conversion credit are never booked. Other banks' EMI wording is UNVALIDATED, and any unrecognised EMI, instalment or loan row is listed for a decision, never booked. Card sub-accounts: a card with an account under "Credit cards of this entity" (Entities tab, This entity sub-tab), paid on or after ccp_split_from, has each bank payment moved onto its sub-account and its spends booked there; the pool (parent plus sub-accounts) must tie to the unsplit figure or no import file is written. Corporate card prepayments: paste the code printed beside an unmatched payment to book it to the prepayment account; nothing is marked for you. Uses the LLM to suggest an account for spends the rules cannot place; if that AI pass stops, the rows it did not reach go to suspense and the result says so.
  when_to_use: >
    After the bank statements are imported and the card statements are sorted, when you want the
    card spends booked to their expense accounts.
  inputs:
    - name: "entity"
      tooltip: "The entity whose book this is. Its Bank Service Charge, Drawings and card default accounts come from entities.yaml."
      accepts: "One of the entities in entities.yaml."
      gotchas: "A run with card fees stops with a named error if the entity has no bank_service_charge_account."
    - name: "fy"
      tooltip: "The financial year of the book."
      accepts: "One of the years the tax rules cover."
      gotchas: "Pick the year of the book you want the payments read from."
    - name: "gnucash_path"
      tooltip: "The book. It is only read."
      accepts: "A .gnucash file."
      gotchas: "A book that cannot be read stops the run; nothing is booked."
    - name: "pdf_dir"
      tooltip: "The Decrypted_PDFs_Correct/ folder created by Credit Card - Sort PDFs."
      accepts: "A folder of decrypted statement PDFs."
      gotchas: "Read statements from before the range too, if you want the first payments of the range to settle them."
    - name: "period"
      tooltip: "Which bank payments (and statements) to cover."
      accepts: "A FY, a quarter of a FY, or a custom date range."
      gotchas: "A payment that settles a statement from before the period is listed as a RED FLAG, not booked."
    - name: "custom_start"
      tooltip: "Start date, only used when 'Custom date range' is selected."
      accepts: "YYYY-MM-DD."
      gotchas: "Both start and end are required for a custom range."
    - name: "custom_end"
      tooltip: "End date, only used when 'Custom date range' is selected."
      accepts: "YYYY-MM-DD."
      gotchas: "Both start and end are required for a custom range."
    - name: "prepayment_marks"
      tooltip: "Codes printed beside unmatched payments in the report. Each code books that payment to the prepayment account (Drawings) instead of leaving it in the pool."
      accepts: "Codes separated by spaces or commas. Needs ccp_split_from and prepayment_account, set under 'Credit card split settings (apply to every entity)' on the Entities tab, All entities sub-tab."
      gotchas: "Only unmatched payments on or after the split date can be marked. Nothing is marked for you."
    - name: "cred_emails"
      tooltip: "Folder of CRED payment confirmation emails (.msg). They only confirm which card a bank payment was for; they never book anything."
      accepts: "A folder. Only .msg files from the cred.club domain are read; other files are skipped and counted."
      gotchas: "Leave blank to run exactly as before. An email naming a different card than the payment is routed to holds that payment and raises a RED FLAG. Needs the card list."
  steps:
    - "Run Credit Card - Sort PDFs first, and import the bank statements into the book."
    - "Pick the entity and financial year, then the statements folder and the period."
    - "Read the result from the top: a RED FLAG block means a bank payment matched no statement."
    - "Review the import-ready CSV in the Review tab, then import it into GnuCash."
  outputs:
    folder: "Data/outputs/"
    files:
      - name: "YYYY-MM-DD-HHMMSS-<input>-CC-Spend_GnuCash_import_ready.csv"
        tooltip: "Journals ready to import. Transfer Account is Credit Card Payment; Account is the spend, refund or fee account."
      - name: "..._report.xlsx"
        tooltip: "Journals, payments matched, payments without a statement, large spends, fees, EMI rows, the Credit Card Payment tie-out and issues."
  tips: >
    A spend at or above the large-spend threshold (Settings, default 20,000) is flagged as a possible asset.
    The flag never changes its account.

    While it runs, the panel shows the newest step, in the form Reading statement 3 of 12 - about 4 min left
    (no estimate is shown until the first statement is read). Press Stop to end the run: the panel says
    "Stopping..." at once and then "Cancelled", and no output file is written. The skill stops at a safe point
    (between statements and between its stages), so a statement already being read is finished first. If you
    stop during the AI pass, none of its partial answers are written.
  troubleshooting:
    - problem: "RED FLAG: payments match no statement."
      fix: "Check the statements folder has the statement the payment settles, and that its dates make it the card's next statement."
    - problem: "A payment in the Credit Card Payment tie-out is labelled HELD and the pool is not tied."
      fix: "A CRED confirmation email named a different card than the payment, so the payment was held and not booked (the line reads 'HELD: card clash, not booked'). It stays in the tie-out as an open amount, so the tie-out does not read as tied. Check the email and the payment, then run again."
    - problem: "Nothing was written."
      fix: "No journal was ready to import; the result lists why (statements that read 0 rows, part payments, EMI rows)."
    - problem: "Run errors mentioning the endpoint / model."
      fix: "The account for a spend or refund is chosen by rules and history first, then by the LLM for what is left. If the LLM cannot be reached, its pass stops, the remaining rows go to Suspense and the result says it is not complete. Start Ollama or set an endpoint in Settings. If the run stops because the endpoint address is not allowed: http:// works only for this computer and private-network addresses, and never with an API key. Anything else needs https://. Change the Base URL in Settings."
    - problem: "The run stops with a message about a time limit or a step limit."
      fix: "The model did not answer in time (10 minutes for a model on this computer or a private network, 2 minutes for any other, including Ollama cloud models), or the run used 15 steps without finishing. Use a smaller or faster model, or try a simpler request. A reply longer than 4,096 tokens is cut off and ends with a note saying so."
