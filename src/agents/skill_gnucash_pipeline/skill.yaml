# skill.yaml — GnuCash Import Pipeline manifest

name: "gnucash_pipeline"
display_name: "Convert to GnuCash"
description: >
  End-to-end import pipeline: upload a raw bank statement and your GnuCash book,
  get back a GnuCash-ready mapped CSV in one click. No intermediate steps.
  Supports ICICI (XLS), Bank of Baroda (PDF), HSBC (PDF), HDFC (PDF incl.
  password-protected, XLS/XLSX, CSV — all deterministic, no LLM), Kotak
  (PDF), and any other bank via CSV upload with LLM-assisted column
  normalisation.
  Chain: bank extraction → canonical format → account mapping.
category: "gnucash"
version: "1.2.0"

mode: "agent"
entry_point: "agent:run"

inputs:
  - name: "bank"
    type: "select"
    label: "Bank"
    required: true
    options_from: "banks"

  # The entity sits right after `bank` and before the book it fills in. It is
  # consumed (MAP-34/35 and BNK-05 read its profile), so it must NOT be the
  # first consumed input -- `bank` leads, and names the output file (pinned by
  # tests/test_entity_book_wiring.py).
  - name: "entity"
    type: "select"
    label: "Entity (optional) -- fills in the GnuCash book below from the registry"
    options_from: "itr_entities"
    required: false

  - name: "statement_files"
    type: "files"
    label: "Statement file(s) — XLS for ICICI; PDF(s) for BoB / HSBC / Kotak (HSBC also takes an already-enriched .xlsx); CSV or XLS/XLSX for HDFC / Other"
    file_types: [".xls", ".xlsx", ".pdf", ".csv"]
    required: true

  - name: "gnucash_file"
    type: "file"
    label: "GnuCash book (.gnucash) — must be closed in GnuCash"
    file_types: [".gnucash"]
    required: true
    book_from: "entity"

  - name: "pdf_password"
    type: "password"
    label: "Statement password (HDFC PDF or SBM xlsx, if protected — for HDFC often the Cust ID)"
    required: false

  # IMP-08: only needed when several of YOUR accounts match the bank name and
  # the statement does not say which. Choices come from the book + bank above
  # and list postable accounts only (never hidden / placeholder).
  - name: "bank_account"
    type: "select"
    label: "Bank account (optional -- only if several of your accounts are at this bank and the statement does not say which)"
    options_from: "bank_accounts"
    depends_on: ["gnucash_file", "bank"]
    required: false

run_args:
  bank: "{inputs.bank}"
  statement_files: "{inputs.statement_files}"
  gnucash_file: "{inputs.gnucash_file}"
  output_path: "{output_path}"
  config_path: "{config_path}"
  model_override: "{model_override}"
  pdf_password: "{inputs.pdf_password}"
  bank_account: "{inputs.bank_account}"
  entity: "{inputs.entity}"
  entities_path: "{data_root}/itr/entities.yaml"

output:
  extension: ".csv"
  suffix: "GnuCash_import_ready"
  download_label: "Download Import-Ready CSV"

requires:
  native_binaries: []
  external_tools: []

help:
  overview: >
    The one-click, end-to-end importer: upload a raw bank statement and your
    GnuCash book and get back a GnuCash-ready, account-mapped CSV — no
    intermediate steps. It chains bank extraction, conversion to canonical
    format, and account mapping for you. HDFC statements are handled fully
    deterministically (no LLM) across all four input shapes it accepts —
    normal PDF, password-protected PDF, XLS/XLSX exports, and CSV exports —
    including automatic OCR fallback if a PDF's text layer is garbled.
  when_to_use: >
    Use this when your goal is to get transactions into GnuCash. Use the
    individual bank skills (BoB, HDFC, etc.) instead only when you want the
    extracted CSV without account mapping.
  inputs:
    - name: "bank"
      tooltip: "Which bank the statement is from — this picks the right extractor."
      accepts: "One of: ICICI, Bank of Baroda, HSBC, HDFC, Kotak, Other Bank (CSV)."
      gotchas: "Pick 'Other Bank (CSV)' for any bank without a dedicated extractor; columns are normalised with LLM help."
    - name: "statement_files"
      tooltip: "The statement file(s), matching the bank you chose."
      accepts: "XLS for ICICI; PDF(s) for BoB / HSBC / Kotak; CSV or XLS/XLSX for HDFC / Other. HSBC also accepts a single already-enriched .xlsx/.xlsm workbook (this skill's own output) instead of PDFs."
      gotchas: "File type must match the selected bank, or extraction will fail."
    - name: "gnucash_file"
      tooltip: "Your GnuCash book — used to learn your accounts and map transactions."
      accepts: "GnuCash file (.gnucash)."
      gotchas: "Must be closed in GnuCash so the file is not locked. It is read only, never modified."
    - name: "entity"
      tooltip: "Optional — pick an entity to auto-fill the GnuCash book field from the registered book for that entity."
      accepts: "One of the entities defined in entities.yaml, via dropdown."
      gotchas: "UI convenience only; leave unset to pick the file manually as before. A line under the dropdown tells you whether a registered book was found."
    - name: "bank_account"
      tooltip: "Which of your accounts at this bank the statement is for. Leave blank unless the run stops and asks."
      accepts: "One of the postable accounts at the chosen bank, listed from your book."
      gotchas: "Hidden and placeholder accounts are never offered and are refused if typed in. If several accounts match and nothing on the statement tells them apart, the run stops and lists them rather than guessing."
    - name: "pdf_password"
      tooltip: "Used for an HDFC PDF or an SBM xlsx that is itself password-protected."
      accepts: "The statement's open password — for HDFC this is often the Cust ID; for SBM it is the workbook's open password."
      gotchas: "Ignored for all other banks and for unprotected HDFC inputs. A wrong or missing SBM password stops the run. Never logged or included in output."
  steps:
    - "Pick the entity (optional) — this fills in the GnuCash book for you."
    - "Choose the bank."
    - "Upload the matching statement file(s)."
    - "Select your .gnucash book (closed in GnuCash), unless the entity already filled it in."
    - "Click Run, then import the resulting CSV via File > Import in GnuCash."
  outputs:
    folder: "Data/outputs/"
    files:
      - name: "YYYY-MM-DD-HHMMSS-<input>-GnuCash_import_ready.csv"
        tooltip: >
          The statement converted to canonical columns AND mapped to your GnuCash
          accounts (based on your book's history), ready to import directly — no
          manual categorising.
  tips: |
    Account mapping learns from your existing GnuCash history, so the more you
    have categorised before, the better the auto-mapping. Review a few rows after
    import the first time. For HDFC, prefer the plain PDF, XLS/XLSX, or CSV export
    over a password-protected PDF when you have the choice — extraction is
    equally deterministic either way, but if HDFC ever hands you a PDF whose
    text layer is garbled (rare, seen on some re-downloaded statements), the
    skill auto-detects it and falls back to OCR, which is typically ~90%+
    accurate rather than exact; re-check the running/closing balance in that
    case.

    **Importing into GnuCash.** In File > Import > Import Transactions from CSV,
    map the columns of the `_GnuCash_import_ready.csv` like this:

    - Date -> Date; Transaction ID -> Number; Description -> Description.
    - Account -> Account; Transfer Account -> Transfer Account.
    - "Amount Negated (Deposit)" -> Amount (Negated); "Amount (Withdrawal)" -> Amount.
    - Balance, Currency, Confidence and MatchReason -> None.

    Why the deposit column is negated: the Account column is the CATEGORY the
    transaction is booked against (income or expense), not your bank, so a deposit
    must be imported as a negated amount for the bank to go up. Use the Amount and
    Amount (Negated) column types, not "Transfer Amount" - GnuCash 5's importer
    needs an Amount column. Save the mapping as a preset in the importer so the
    next import is one click.

  troubleshooting:
    - problem: "Run errors mentioning the endpoint / model."
      fix: "Mapping (and 'Other Bank' normalisation) uses an LLM. Start Ollama or set an endpoint in Settings."
    - problem: "Extraction fails immediately."
      fix: "The file type probably doesn't match the chosen bank (e.g. a PDF selected for ICICI). Re-check both."
    - problem: "Some rows mapped to the wrong account."
      fix: "Fix them in GnuCash after import; future runs learn from the correction."
