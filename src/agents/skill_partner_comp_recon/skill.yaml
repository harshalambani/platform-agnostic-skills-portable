# skill.yaml -- Partner Compensation Reconciliation manifest.
#
# This skill now takes the raw source documents directly, matching every
# other skill in the catalogue (26AS takes a PDF, MF CAS takes an .xlsx,
# AIS Reconcile takes AIS .json) -- it was the only one still requiring a
# human to hand-key a structured YAML/JSON input first. The manifest below
# is that reshape. `payout_advice.py` (L1), `advisory.py` (L3),
# `llp_statement.py` (L5) and `payment_schedule.py` (L4) are now implemented
# parsers. Every optional leg still degrades to an explicit "not available" note
# rather than failing the run or fabricating a figure. The
# structured YAML/JSON input (`input_path`) this skill used to expose is
# retained ONLY as a test-only run() parameter -- it is deliberately absent
# from `inputs:` below so it no longer renders in the UI (see
# tests/test_skill_partner_comp_recon.py's manifest-shape guard test).

name: "partner_comp_recon"
display_name: "Partner Compensation Reconciliation"
description: >
  Reconciles an LLP partner's remuneration, exempt share of profit,
  performance-incentive cohorts (awarded in one financial year, paid out
  in instalments across the next one or two), compulsory capital
  contribution, one-off incentives, and any payroll-stream months for a
  single financial year, against the Compensation Advisory, the bank, Form
  26AS, and the filed return. Reports agree / variance / cannot-reconcile
  per category -- a missing source is never silently treated as a match.
  No tax computation is performed, no .gnucash book is written, and no
  ITR workbook is touched. Takes the monthly payout advices and the
  Compensation Advisory letter as PDFs, plus optional documents for the
  LLP capital tie-out (the LLP Statement of Account), the books tie-out,
  and the TDS-credit tie-out; every one of these optional legs is a real,
  implemented reader (see AGENT.md) -- a leg only degrades to an explicit
  "not available" note when its own input is absent or its document fails
  to parse, never failing this build.
category: "itr"
version: "0.2.0"

mode: "direct"
entry_point: "agent:run"

inputs:
  # advices_dir leads the form (and so supplies the output filename, via
  # run_args below) -- mirroring ITR Workbook's bs_html/entity ordering.
  # entity is declared right after it: it is genuinely required and
  # consumed via run_args (unlike AIS Reconcile's UI-only "entity"), but
  # an itr_entities select must never be the FIRST consumed input, or it
  # would silently name the output file after the taxpayer instead of the
  # statement (see tests/test_entity_book_wiring.py). Picking someone
  # here also fills in the GnuCash book input below (book_from).
  - name: "advices_dir"
    type: "files"
    label: "Monthly partner payout certificates / payslips"
    file_types: [".pdf"]
    required: true
  - name: "entity"
    type: "select"
    label: "Entity"
    options_from: "itr_entities"
    required: true
  - name: "doc_password"
    type: "password"
    label: "Document password (optional -- if the advices/advisory PDFs are protected)"
    required: false
  - name: "advisory_path"
    type: "file"
    label: "Compensation advisory / target compensation advice"
    file_types: [".pdf"]
    required: true
  - name: "llp_statement"
    type: "file"
    label: "LLP statement of account (enables leg 1, the capital sign-off)"
    file_types: [".pdf"]
    required: false
  - name: "payment_schedule"
    type: "file"
    label: "Incentive payment schedule (enables the schedule leg -- takes precedence over the payout advices when both agree, and reports any disagreement)"
    file_types: [".pdf"]
    required: false
  - name: "gnucash_path"
    type: "file"
    label: "GnuCash book (READ ONLY -- enables the books tie-out)"
    file_types: [".gnucash"]
    required: false
    book_from: "entity"
  - name: "xlsx_26as"
    type: "output_file"
    label: "26AS workbook (enables the TDS-credit tie-out)"
    match: "*-26AS.xlsx"
    required: false
  - name: "journal_path"
    type: "text"
    label: "GnuCash journal CSV output path (optional -- Stage 1b)"
    required: false
  - name: "accrual_journal_path"
    type: "text"
    label: "Year-end share-of-profit accrual journal CSV output path (optional -- H35-02, requires journal_path and the LLP statement of account)"
    required: false
  - name: "bank_match_window"
    type: "text"
    label: "Bank-match date window in days (optional -- H35-05, default 7)"
    required: false

run_args:
  entity: "{inputs.entity}"
  advices_dir: "{inputs.advices_dir}"
  doc_password: "{inputs.doc_password}"
  advisory_path: "{inputs.advisory_path}"
  llp_statement: "{inputs.llp_statement}"
  payment_schedule: "{inputs.payment_schedule}"
  gnucash_path: "{inputs.gnucash_path}"
  xlsx_26as: "{inputs.xlsx_26as}"
  output_path: "{output_path}"
  config_path: "{config_path}"
  model_override: "{model_override}"
  journal_path: "{inputs.journal_path}"
  accrual_journal_path: "{inputs.accrual_journal_path}"
  bank_match_window: "{inputs.bank_match_window}"

output:
  extension: ".xlsx"
  suffix: "partner-comp-recon"
  download_label: "Download Partner Compensation Reconciliation"

requires:
  native_binaries: []
  python_packages: ["openpyxl", "pyyaml"]
  external_tools: []
  llm: false
  network: false

help:
  overview: >
    Takes one financial year's partner-compensation documents -- the
    monthly payout advices, the Compensation Advisory letter, and
    optionally the LLP's own capital-account statement, a GnuCash book
    (read only), and a 26AS workbook -- and cross-checks the figures they
    carry against each other. Every rate, percentage and period this skill
    uses (the firm's-tax rate, the capital-contribution rate, the capital
    accretion period, the remuneration-TDS section/rate/start-date) comes
    from that year's own entity/tax-rules config, never hardcoded, since
    all of them change by year and the capital rate has been known to
    change mid-year. A missing rate or a missing source figure produces an
    explicit "cannot reconcile" row naming what is missing, never a
    default or a silently-assumed match. The two required documents (the
    monthly advices and the Advisory) and the optional LLP statement of
    account now parse for real; a document that fails to open/parse
    (unreadable/malformed PDF, wrong password, or content that doesn't
    match the expected layout) still fails the whole run loud, naming the
    document and the reason (the LLP statement is the exception, since it
    is optional -- see its own gotcha below). Every optional document's
    leg (the LLP statement, the incentive payment schedule, the GnuCash
    books tie-out, the 26AS TDS-credit tie-out) degrades to an explicit
    "not available" note when its input is absent, or when its document
    fails to parse -- every one of these readers is real and implemented
    (see AGENT.md), not a placeholder.
  when_to_use: >
    Use this once a financial year's partner-compensation documents are in
    hand and you want a single reconciliation across remuneration, share
    of profit, the incentive cohort ledger, capital contribution, one-offs,
    and (if relevant) a payroll stint -- particularly useful for catching
    a mid-year capital-rate change (which shows up as unequal
    capital-deducted amounts within one incentive cohort) or a one-off
    incentive that was grossed up at the wrong year's tax rate. Not a
    substitute for tax computation or return preparation -- it only
    reconciles the streams against each other and the return's own
    figures; it does not compute tax due.
  inputs:
    - name: "entity"
      tooltip: "The partner/entity this reconciliation is for."
      accepts: "One of the entities defined in entities.yaml, via dropdown."
      gotchas: "Required -- also selects the GnuCash book below when one is registered for this entity."
    - name: "advices_dir"
      tooltip: "All of this financial year's monthly payout certificates / payslips, as PDFs."
      accepts: "One or more PDF files."
      gotchas: >
        Required. Each PDF is dispatched on its CONTENT, never its
        filename, to the monthly payout-advice parser -- a PDF that fails
        to open/parse, or whose content doesn't match that layout, fails
        the whole run loud, naming the file and the reason.
    - name: "doc_password"
      tooltip: "Password for the payout advices / advisory PDFs, if they are protected."
      accepts: "The PDFs' own open password, if any."
      gotchas: "Optional -- leave blank if the PDFs are not password-protected. Never logged, never included in any output file."
    - name: "advisory_path"
      tooltip: "The firm's Compensation Advisory / target compensation advice letter for this financial year."
      accepts: "A single PDF file."
      gotchas: >
        Required. Shares a directory with the monthly payout advices at
        some firms -- this skill dispatches on document CONTENT, never
        filename, since filenames are not a reliable way to tell the two
        document families apart. A PDF that fails to open/parse, or whose
        content doesn't match the Advisory's expected layout, fails the
        whole run loud, naming the file and the reason.
    - name: "llp_statement"
      tooltip: "The LLP's own statement of account for this partner, this financial year."
      accepts: "A single PDF file."
      gotchas: >
        Optional -- enables the capital sign-off leg (leg 1). Absent, or
        supplied but unreadable/malformed/not actually an LLP statement of
        account (wrong document filed here), this leg degrades to an
        explicit "not available" note naming the reason; it never fails
        the whole run and never falls back to a zero or a default. The
        statement is often issued months after the financial year ends, so
        it is common for it to be genuinely unavailable at filing time.
    - name: "payment_schedule"
      tooltip: "The firm's own incentive payment schedule for this financial year (the L4 document)."
      accepts: "A single PDF file."
      gotchas: >
        Optional -- enables the schedule leg, and takes PRECEDENCE over the
        payout advices for gross share of profit and both firm's-tax
        figures (firm_tax_on_sop, firm_tax_others) when supplied. Absent,
        or supplied but unreadable/malformed/not actually a payment
        schedule, this leg degrades to an explicit "not available" note
        naming the reason; it never fails the whole run. A disagreement
        between the schedule and a payout advice is reported as a
        diagnostic note, not a run failure.
    - name: "gnucash_path"
      tooltip: "This entity's GnuCash book, opened READ ONLY for the books tie-out."
      accepts: "GnuCash XML book (.gnucash), optionally gzip-compressed."
      gotchas: "Optional. Never opened for writing by this skill. Absent (or unreadable/malformed), the books tie-out leg is reported 'not available', never defaulted."
    - name: "xlsx_26as"
      tooltip: "26AS workbook produced by this repo's '26AS' skill, for the same entity/year."
      accepts: "Excel (.xlsx) with a Part I (TDS) sheet."
      gotchas: "Optional. Absent (or unreadable/malformed), the TDS-credit tie-out leg is reported 'not available', never defaulted."
    - name: "journal_path"
      tooltip: >
        Optional. When set, also writes a GnuCash multi-split journal CSV
        of the year's implied journal entries (Stage 1b) to this path --
        one monthly-payout transaction per month, plus an opening
        reclassification entry if the input's opening_reclass: block is
        present. Leave blank to only produce the workbook.
      accepts: "A full output file path ending in .csv."
      gotchas: >
        Requires an accounts: block naming the GnuCash account for every
        non-zero split (bank, tds_expense, interest_on_capital,
        current_account, capital_contribution, medical_expense,
        remuneration_income, share_of_profit_income) -- a missing account
        needed by a non-zero month comes back as an "ERROR: ..." naming
        the key and the month, not a traceback. As of H35-05 round 2: the
        journal CSV is ONLY ever written when a GnuCash book (with
        accounts.bank present and resolvable in it) is also supplied, so
        this run's cash leg can be matched against what the bank import
        already posted rather than booking a second, unconditional bank
        leg. Whenever matching cannot run for any reason -- no
        gnucash_path, no accounts.bank configured, the book cannot be
        read, or accounts.bank's path is not found in the book -- the
        journal CSV is refused with an "ERROR: cannot write the journal
        CSV -- ..." message naming the reason, and NO file is written at
        all, even a partial one. The recon workbook (and the accrual
        journal from accrual_journal_path, below, which has no bank leg
        and is unaffected) are still written as normal in this case --
        only the monthly journal CSV is refused.
    - name: "accrual_journal_path"
      tooltip: >
        Optional (H35-02). Requires journal_path to also be set. When set,
        and the LLP statement of account (llp_statement) parsed and its
        "Profit Share for the Year" figure is available, writes a SEPARATE
        one-transaction CSV -- never merged into journal_path's file --
        dated 31 March of the financial year's END year (e.g. FY "2025-26"
        -> 2026-03-31, never the FY start year), accruing the difference
        between the L5 statement's own year-end profit-share figure and
        the total already booked by the monthly journal (Dr
        current_account / Cr share_of_profit_income). No file is written,
        and a note explains why, when: no LLP statement was supplied or it
        didn't parse; its profit-share figure is missing; the difference
        is within Rs 1.00 (already ties); or the difference is negative
        (the monthly total already booked exceeds the L5 figure --
        FLAGGED for manual review, never reversed automatically).
      accepts: "A full output file path ending in .csv, different from journal_path."
      gotchas: >
        Reuses the same accounts: block as journal_path -- specifically
        current_account and share_of_profit_income must both be supplied.
        A residual current-account comparison against the L5 statement is
        always performed after this accrual and reported in the run
        summary; it is never booked, even when it shows a variance.
    - name: "bank_match_window"
      tooltip: >
        Optional (H35-05). How many days either side of a monthly payout's
        month-end date to look for a matching bank credit already posted in
        the book. Defaults to 7 when left blank or unparsable.
      accepts: "A whole number of days, e.g. 7 or 14."
      gotchas: >
        Only used when both gnucash_path and accounts.bank are available
        and resolvable in the book. As of H35-05 round 2, that
        availability is no longer optional for journal_path: when a book
        cannot be used for matching (missing, unreadable, or
        accounts.bank absent/not found in it) AND journal_path was
        requested, the journal CSV is refused outright rather than
        falling back to the pre-H35-05 unconditional bank leg -- see
        journal_path's own gotchas above. The recon workbook alone (no
        journal_path) still runs and reports the bank-match leg as "not
        available" in that case, exactly as before. When a book IS
        available: each payout is matched to a bank credit within Re 1
        and within this window, one-to-one, nearer date wins; two
        equally-close candidates are NEVER auto-picked -- that payout
        gets no journal and is flagged TIE (candidates listed) instead. A
        deposit split across two or more counter-accounts is also never
        auto-picked -- that payout gets no journal and is flagged SPLIT
        (naming every counter-account the bank import spread it across),
        distinct from a genuine NO_MATCH gap, since a matching credit WAS
        found, just not one this skill can route a single journal leg
        to. A matched payout's cash leg posts to the bank import's OWN
        counter-account for that credit, never a second leg on the bank
        account itself. See the workbook's "Bank match" sheet and the run
        summary's "BANK MATCH" block for full detail, per payout.
  steps:
    - "Pick the entity."
    - "Pick this financial year's monthly payout advices (one or more PDFs) and the Compensation Advisory letter."
    - "Optionally supply the LLP statement, the incentive payment schedule, a GnuCash book, and/or a 26AS workbook to enable their tie-out legs."
    - "Click Run."
    - "Download the workbook and review the Reconciliation and Exceptions sheets first, then Capital for any mid-year rate-change warning."
  outputs:
    folder: "Data/outputs/"
    files:
      - name: "YYYY-MM-DD-HHMMSS-<input>-partner-comp-recon.xlsx"
        tooltip: >
          Ten sheets: Logic (the seven reconciled legs and the governing
          identity, in prose), Drivers (every rate/period/date as a
          labelled input cell -- the only sheet where one appears as a
          literal), Monthly grid, Payroll stream (only present if the
          input supplied payroll months), One-offs (the gross-up and its
          roundness check), Cohorts (the incentive ledger with its
          reporting/prior/future FY-assignment column), Capital (the rule
          as a formula off Drivers, the Advisory cross-check, and the
          mid-year rate-change detector), Interest on capital (H35-06 --
          the computed simple-interest schedule per capital tranche added
          this year -- informational; its basis is not established against
          the LLP Statement's own method), CTC check (H35-08 -- the informational Target
          Compensation walk-down), Reconciliation (agree / variance
          / cannot-reconcile per category -- topped by a highlighted
          "STATEMENT DISAGREES" block when the LLP Statement of Account
          disagrees with another source or fails its own arithmetic; see
          the tip below), Exceptions (every non-agreeing or
          non-reconcilable row collected together), and Open items
          (anything left unresolved and what would close it). A "Bank
          match" sheet (H35-05) is also added whenever a GnuCash book and
          accounts.bank are both available: one row per monthly payout
          showing which bank credit already posted in the book it matched
          to (date/amount/account), or why it did not (no bank credit
          found, a TIE naming every equally-close candidate, or a SPLIT
          naming every counter-account a matching-but-unroutable deposit
          was spread across).
      - name: "<journal_path> (optional -- Stage 1b, only written if journal_path is set)"
        tooltip: >
          A GnuCash multi-split journal CSV: one balanced transaction per
          monthly payout (dated month-end), plus an opening
          reclassification entry if opening_reclass: was supplied. Import
          via File > Import > Import Transactions from CSV with Multi-split
          ticked, skipping the 1 header line, Date mapped as ISO, and the
          Amount column mapped to the importer's Amount column type.
      - name: "<accrual_journal_path> (optional -- H35-02, only written if accrual_journal_path is set AND an accrual was computed)"
        tooltip: >
          A SEPARATE one-transaction GnuCash multi-split journal CSV,
          dated 31 March of the financial year's END year (e.g. FY
          "2025-26" -> 2026-03-31): the year-end share-of-profit accrual
          per the LLP statement of account. Same
          import settings as journal_path's file, above. Never contains
          the monthly transactions -- import both files if both were
          produced.
  tips: >
    The computed Interest on Capital schedule (H35-06, its own workbook
    sheet) applies simple interest, actual days / 365, to every capital
    tranche added this financial year, from an interest-from-date
    defaulting to the first day of that tranche's own payslip month. The
    rate defaults to 6% p.a. unless the entity's partner_comp_drivers config
    sets drivers.capital_interest_rate for this financial year explicitly
    (e.g. the year the LLP actually changed its rate) -- this default is
    never applied inside the reconciliation engine itself, only here, and a
    per-tranche interest-from-date can likewise be overridden via
    drivers.capital_interest_from_date_overrides ({"YYYY-MM": "YYYY-MM-DD"},
    keyed by the tranche's own payslip month). This schedule's total is
    shown against the LLP Statement's own interest-on-capital figure as its
    own reconciliation row, but that row is always INFORMATIONAL (H35-06
    correction): this schedule's BASIS (rate, day-count convention,
    interest-from date) is not established to be the same one the LLP
    Statement itself uses, so a gap here -- of any size -- is never a
    disagreement with the statement and never enters the "STATEMENT
    DISAGREES" block or the reconciliation counts. The statement's
    interest-on-capital figure is independently checked by the "L5
    tie-out: interest on capital" row instead (that row ties the payslip's
    own printed figure to the statement). This schedule sheet only models
    one possible (KPMG's) computation method.

    Separately, "s.194T TDS on interest on capital" (H35-06 correction) IS
    a real, non-informational check: it isolates the TDS withheld on
    interest alone by taking, for each month interest on capital was paid,
    the payment schedule's tds_on_rem_ioc less the payslip's own tds (the
    schedule additionally covers interest; the payslip does not), and
    compares the total against the configured s.194T rate times the LLP
    Statement's interest-on-capital figure. The rate is read from
    drivers.capital_interest_tds_rate for the financial year; if that is
    not set, it falls back to drivers.remuneration_tds_rate (both are, in
    substance, the same partner-payments withholding rate) -- never a
    hardcoded rate. A month that paid interest but is missing either TDS
    figure is CANNOT RECONCILE, never assumed to be 0. This check never
    adds a journal leg of its own: the monthly journal's single
    tds_expense leg already carries the COMBINED remuneration+interest TDS
    (the schedule's tds_on_rem_ioc takes precedence over the payslip's own
    figure -- see mapper.py), and reuses that same figure whether or not
    this check runs.

    The CTC structuring check (H35-08, its
    own workbook sheet) walks Target Compensation down to the cash pool
    actually paid (remuneration + gross share of profit + CTC structuring
    components + arrears) using the same incentive payment schedule already
    supplied above (payment_schedule) -- no separate input is needed; it is
    purely informational and never enters the "STATEMENT DISAGREES" block.

    Start with the Reconciliation sheet, then Exceptions -- a
    "CANNOT RECONCILE" status names exactly which source figure for that
    category was not supplied, so a "cannot reconcile" row is something to
    fix in the input, not a defect in the workbook. On Capital, a "RATE
    CHANGE SUSPECTED" row means the incentive cohort's instalments show
    unequal capital-deducted amounts -- re-read that year's Compensation
    Advisory, since it will have been reissued at a new rate part-way
    through the cohort. The LLP Statement of Account (L5), when supplied,
    is the REFERENCE for every row it carries a figure for (closing
    capital, current-account closing, remuneration, interest on capital,
    profit share, drawings) -- every other source is measured against it,
    never averaged in as an equal peer. Any disagreement beyond the Re 1
    tolerance, or a failure in the statement's own arithmetic, is flagged
    both at the top of the run summary text and in a highlighted
    "STATEMENT DISAGREES" block above the Reconciliation sheet's table --
    check that block first, before the per-row statuses below it.
  troubleshooting:
    - problem: "A category shows 'CANNOT RECONCILE' with a reason naming a driver or a figure."
      fix: "That figure isn't available for this financial year -- this skill never guesses or falls back to a prior year's value."
    - problem: "A 'STATEMENT DISAGREES' block appears at the top of the run summary / Reconciliation sheet."
      fix: "The LLP Statement of Account (L5) is the reference for that row, and another supplied source (or the statement's own printed arithmetic) disagrees with it beyond the Re 1 tolerance -- the note spells out 'Statement says X; <source> says Y; difference Z' or names the failed arithmetic check. Investigate the disagreement; this skill never picks a winner for you."
    - problem: "'Total cash received (monthly payouts) vs Bank' still shows 'NOT CHECKED YET (bank credits are matched in H35-05)'."
      fix: "As of H35-05, this row is only left as NOT CHECKED YET when there is nothing to check against -- no GnuCash book was supplied, or no accounts.bank is configured for this entity. Whenever both are available, this row is replaced with a real per-payout bank match result: AGREE when every monthly payout matched a bank credit already posted in the book (within Re 1 and the bank_match_window), or CANNOT RECONCILE naming how many payouts did not (see the 'BANK MATCH' block in the run summary and the workbook's 'Bank match' sheet for the per-payout detail, including any TIE candidates)."
    - problem: "The run summary shows a 'BANK MATCH -- N payout(s) could not be matched...' block, or the 'Bank match' sheet shows NO_MATCH / TIE / SPLIT rows."
      fix: "NO_MATCH means no bank credit within Re 1 and bank_match_window days of that payout's month-end date was found in the book at all -- a genuine gap, never silently booked; investigate the bank statement/book for that period. TIE means two or more equally-close bank credits qualified and none was auto-picked (the user's ruling: a tie is never auto-picked) -- the candidates are listed with date/amount/account; either narrow bank_match_window, or resolve the ambiguity in the book, then re-run. SPLIT (H35-05 round 2) means a matching credit WAS found, but the bank import posted it across two or more counter-accounts, so there is no single account to route this skill's journal leg to -- the counter-accounts are named; this is never reported as a genuine gap (a credit did match) and is never auto-routed to any one of them. None of NO_MATCH / TIE / SPLIT ever gets a journal line for that payout's cash leg -- see journal_path's output, which simply omits that month's transaction rather than guessing (the OTHER, matched payouts' journal lines are written normally). This is different from matching being UNAVAILABLE altogether (no book, no accounts.bank, an unreadable book, or accounts.bank not found in it) -- that case is a structural refusal, not a per-payout gap, and as of H35-05 round 2 it refuses the WHOLE journal CSV with an ERROR rather than falling back to the pre-H35-05 unconditional bank leg -- see journal_path's own gotchas."
    - problem: "The D1 drawings row ('Current-account drawings: statement vs (net monthly payouts + TDS + other payslip deductions - gross interest on capital)') shows a gap I can't explain."
      fix: "The identity is: statement current drawings = net monthly payouts + s.194T TDS withheld + other payslip deductions paid on the partner's behalf (e.g. medical top-up) - interest on capital, GROSS. Interest on capital is credited to/drawn from the CAPITAL column of the LLP Statement, not the current account, so it is backed OUT of this current-account identity -- and it must be the GROSS figure, not the net-of-its-own-s.194T-TDS amount that lands in the payout (that TDS is already inside the TDS total above, so subtracting the net figure would double-count it). The row's note spells out the full build-up (each component and its value) so you can see exactly where a gap comes from."
    - problem: "A row's note starts with 'PENDING JOURNAL POSTING (provided by this skill)'."
      fix: "This is not a disagreement. The Statement and the books gap by more than Re 1 today, but this skill's own not-yet-posted journal (its monthly lines or its year-end share-of-profit accrual) closes that gap to within Re 1 once posted -- the note names the journal id(s) and amount. Post the journal(s) named and the row is reconciled; nothing further to investigate. If posting the journal only closes PART of the gap, the row instead reports the genuine residual left over (as a normal disagreement) rather than the pre-journal gap or this pending-journal wording."
    - problem: "A GnuCash tie-out row (bank, TDS, interest on capital, current account, capital contribution, medical expense, remuneration income, or share of profit income) shows 'PENDING JOURNAL POSTING (provided by this skill)' instead of a plain AGREE/VARIANCE."
      fix: "Same rule as the L5 rows above, extended to every GnuCash tie-out row: when this run's own posted-check finds that account's monthly journal not yet posted in the book, the row is compared against the book PLUS that journal rather than the book alone, and is reconciled once the named journal id(s) are posted. A row on 'current_account' or 'capital_contribution' may also name a separately posted prior-period reclassification journal (Num starting with this firm-FY's prefix, e.g. '<FIRM>-<FY>-RECT') -- that journal is a real posted movement from capital to the current account from an earlier run of this skill, folded into the computed side as its own named line, never counted toward a variance."
    - problem: "'Exempt share of profit (s.10(2A)) vs the filed return' shows 'NOT CHECKED (return not supplied)' instead of AGREE."
      fix: "This is expected, not a defect. The LLP Statement's Profit Share for the Year is present and correct -- only the comparison against the filed income tax return is skipped because the return wasn't supplied. It never counts as a failure and never appears in the 'STATEMENT DISAGREES' block; supply the filed return to get an actual comparison."
    - problem: "'Incentive instalments: award-year Advisory vs payment schedule' note now starts with 'INFORMATIONAL (superseded by ...)'."
      fix: "This category is no longer the primary drawings check -- see the new 'Current-account drawings: statement vs (net monthly payouts + s.194T TDS withheld)' row for that. This one still reports a genuine Advisory-vs-schedule disagreement when it fires; it is informational, not retired."
    - problem: "'Interest on capital: computed (schedule, ...) vs LLP Statement' shows INFORMATIONAL with a large gap, even though the LLP Statement is otherwise agreeing everywhere else."
      fix: "This is expected (H35-06 correction), not a defect. This schedule models one possible (KPMG's) simple-interest computation off the payslip's own capital movements; its basis (rate, day-count, interest-from date) is not established to be the same one the LLP Statement uses, so it is never compared as a genuine disagreement, however large the gap. The statement's own interest-on-capital figure is independently checked by the 'L5 tie-out: interest on capital' row instead -- check that row for the real tie-out."
    - problem: "'s.194T TDS on interest on capital' shows CANNOT RECONCILE even though interest on capital was paid this year."
      fix: "This check needs, for every month interest on capital was paid, BOTH the payment schedule's tds_on_rem_ioc and the payslip's own tds figure (to isolate the interest-only TDS by difference), plus a configured rate (drivers.capital_interest_tds_rate, or drivers.remuneration_tds_rate as a fallback) and the LLP Statement's own interest-on-capital figure (to compute the expected TDS). The reason names exactly which of these is missing for which month; supply it rather than assuming the TDS was 0."
    - problem: "Reconciliation shows AGREE for two sources that are not byte-for-byte equal."
      fix: "Every reconciliation in this skill (including the L5 tie-out rows) uses a Re 1 tolerance: two sources within Rs 1.00 of each other tie, anything more is reported as VARIANCE. This is a fixed, named constant (engine.RECONCILIATION_TOLERANCE), never a per-run setting -- it absorbs paisa-level rounding between sources, not a genuine discrepancy."
    - problem: "Reconciliation shows VARIANCE on the incentive schedule leg."
      fix: "A VARIANCE means the supplied payment schedule and a payout advice genuinely disagree on gross share of profit or a firm's-tax figure for that month -- check the Note column for the exact numbers. The schedule's own figure is what is used; the disagreement is reported, not silently resolved."
    - problem: "'ERROR: could not parse ...' naming the advisory letter or a payout advice."
      fix: "The PDF is unreadable/malformed, password-protected without the right password, or its content doesn't match the expected layout (e.g. an L1 payout certificate misfiled as the Advisory) -- fix the underlying document/password, not the filename."
    - problem: "Incentive payment schedule leg shows 'not available' even though payment_schedule was supplied."
      fix: "The document failed to open/parse, or its content didn't match the payment schedule's expected layout -- the reason is named in the note itself; this leg degrades rather than failing the run, so check the note text and re-supply the correct document."
    - problem: "LLP capital sign-off leg (leg 1) shows 'not available' even though llp_statement was supplied."
      fix: "The document failed to open/parse, or its content didn't match the LLP Statement of Account layout (e.g. it doesn't carry a combined CAPITAL ACCOUNT / CURRENT ACCOUNT header and a 'STATEMENT OF ACCOUNT OF ... AS ON <date> MARCH, <year>' phrase) -- the reason is named in the note itself; this leg degrades rather than failing the run, so check the note text and re-supply the correct document."
